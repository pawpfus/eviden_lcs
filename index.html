<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>Eviden LCS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e1116">
  <link rel="icon" href="icon.png" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ===== COCKPIT — light (counterpart) ===== */
  :root{
    --bg:#eef1f5; --card:#ffffff; --soft:#f1f4f8;
    --line:#e2e7ee; --line-2:#cdd5df;
    --ink:#0f141a; --ink-2:#3b444f; --ink-3:#6a7480; --ink-4:#a6afba;
    --accent:#4c7a00; --accent-ink:#ffffff; --accent-soft:rgba(76,122,0,.10); --accent-line:rgba(76,122,0,.35);
    --excel:#12915d; --pdf:#d8493a; --danger:#d8493a;
    --glow:rgba(76,122,0,.10);
    --spine:#0f141a; --spine-ink:#ffffff;
    --shadow:0 1px 2px rgba(15,25,40,.05), 0 10px 26px rgba(15,25,40,.06);
    --radius:7px;
    /* legacy aliases so any stray reference still resolves */
    --accent-2:var(--accent); --moss:var(--accent); --moss-2:var(--accent); --moss-3:var(--soft); --moss-4:var(--soft); --gold:var(--accent);
  }
  /* ===== COCKPIT — dark (default / hero) ===== */
  body.dark{
    --bg:#0e1116; --card:#161b22; --soft:#1b212a;
    --line:#242c36; --line-2:#323b47;
    --ink:#e6ecf3; --ink-2:#aab4c1; --ink-3:#6b7686; --ink-4:#454f5c;
    --accent:#c2f24a; --accent-ink:#12160a; --accent-soft:rgba(194,242,74,.13); --accent-line:rgba(194,242,74,.38);
    --excel:#2fbd7e; --pdf:#ff6a5a; --danger:#ff6a5a;
    --glow:rgba(194,242,74,.10);
    --spine:#c2f24a; --spine-ink:#12160a;
    --shadow:0 1px 0 rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    transition:background .3s,color .3s;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(1100px 460px at 50% -220px,var(--glow),transparent 70%)}
  ::selection{background:var(--accent-soft)}
  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:var(--card);color:var(--ink);
    border-top:2px solid var(--accent);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:38px;height:38px;border-radius:9px;flex:0 0 auto;overflow:hidden;
    background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 0 0 3px var(--accent-soft)}
  .logo svg{width:22px;height:22px}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;line-height:.96;white-space:nowrap;text-transform:none}
  .brand p{margin:2px 0 0;font-size:10.5px;color:var(--ink-3);font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
  .spacer{flex:1}
  .save-pill{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px;white-space:nowrap;letter-spacing:.02em;text-transform:uppercase}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent-line)}
  .save-dot.saving{animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-line)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .btn{appearance:none;border:1px solid transparent;cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;
    padding:9px 14px;border-radius:var(--radius);display:inline-flex;align-items:center;gap:8px;
    transition:transform .08s ease,filter .15s ease,background .15s,border-color .15s;white-space:nowrap;letter-spacing:.01em}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:16px;height:16px}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn-ghost:hover{background:var(--soft);border-color:var(--line-2)}
  .btn-toggle{appearance:none;cursor:pointer;width:34px;height:34px;flex:0 0 auto;padding:0;border-radius:8px;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--soft);border:1px solid var(--line);color:var(--ink-2);
    transition:background .15s,transform .12s,color .15s,border-color .15s}
  .btn-toggle:hover{background:var(--card);color:var(--ink);border-color:var(--line-2)}
  .btn-toggle:active{transform:scale(.94)}
  .btn-toggle svg{width:16px;height:16px}
  .btn-gold{background:var(--excel);color:#fff}
  .btn-gold:hover{filter:brightness(1.08)}
  .btn-white{background:var(--pdf);color:#fff}
  .btn-white:hover{filter:brightness(1.08)}
  /* ---------- Layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 90px;position:relative;z-index:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .card-head .ic{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-line);display:grid;place-items:center;color:var(--accent)}
  .card-head .ic svg{width:18px;height:18px}
  .card-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .card-head p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
  .step{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.16em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  .card-body{padding:18px}
  /* ---------- Form ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
  input[type=text],input[type=date],textarea,select{
    font:inherit;font-size:13.5px;color:var(--ink);background:var(--soft);
    border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;width:100%;
    transition:border .15s,box-shadow .15s,background .15s;
  }
  input::placeholder,textarea::placeholder{color:var(--ink-4)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card)}
  select{cursor:pointer;-webkit-appearance:menulist;appearance:auto}
  textarea{resize:vertical;min-height:120px;line-height:1.55;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  /* ---------- Import ---------- */
  .auto-cta{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;
    background:var(--soft);
    border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;margin-bottom:16px;
    transition:transform .1s,box-shadow .15s,border-color .15s,background .15s}
  .auto-cta:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--accent-line);background:var(--card)}
  .auto-cta .auto-ic{width:38px;height:38px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
    background:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px var(--accent-soft)}
  .auto-cta .auto-ic svg{width:20px;height:20px}
  .auto-cta .auto-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .auto-cta .auto-txt strong{font-size:13px;font-weight:700}
  .auto-cta .auto-txt span{font-size:11.5px;color:var(--ink-3);line-height:1.4}
  .auto-cta .auto-arrow{flex:0 0 auto;color:var(--accent)}
  .or-sep{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.16em;margin:2px 0 14px}
  .or-sep::before,.or-sep::after{content:"";flex:1;height:1px;background:var(--line)}
  /* ---------- Table ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar .count{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;color:var(--ink-3);font-weight:600;
    background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 9px;letter-spacing:.02em}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:6px}
  .btn-icon{width:36px;height:36px;padding:0;border-radius:8px;justify-content:center}
  .btn-icon svg{width:18px;height:18px}
  .btn-emerald{background:var(--accent);color:var(--accent-ink)}
  .btn-emerald:hover{filter:brightness(1.06)}
  .btn-line{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
  .btn-line:hover{background:var(--soft);color:var(--ink);border-color:var(--line-2)}
  .rows{display:flex;flex-direction:column;gap:12px}
  .entry{
    border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden;
    transition:box-shadow .15s,border-color .15s;
  }
  .entry:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
  .entry-top{display:flex;gap:0;align-items:stretch}
  .entry-no{
    flex:0 0 58px;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;
    border-right:1px solid var(--line);background:var(--soft);
  }
  .entry-no span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-3);font-weight:700;letter-spacing:.12em}
  .entry-no input{width:44px;text-align:center;background:var(--card);border:1px solid var(--line);color:var(--accent);font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;padding:5px 2px;border-radius:6px;font-size:13px}
  .entry-main{flex:1;padding:13px 15px;min-width:0}
  .entry-fields{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;margin-bottom:10px}
  .entry-fields .field-sm{display:flex;flex-direction:column;gap:4px}
  .field-sm label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .entry-fields input,.entry-fields select,.field-sm input{padding:8px 10px;font-size:12.5px}
  .del-btn{flex:0 0 auto;align-self:flex-start;margin:11px 11px 0 0;background:transparent;border:1px solid transparent;color:var(--ink-3);width:30px;height:30px;border-radius:6px;cursor:pointer;display:grid;place-items:center;transition:.15s}
  .del-btn:hover{color:var(--danger);background:var(--soft);border-color:var(--line)}
  .del-btn svg{width:15px;height:15px}
  /* eviden */
  .eviden{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 15px 16px 73px;align-items:start}
  .ev-slot{border:1.5px dashed var(--line-2);border-radius:var(--radius);background:var(--soft);min-height:118px;position:relative;overflow:hidden;cursor:pointer;transition:.15s;display:grid;place-items:center}
  .ev-slot:hover{border-color:var(--accent-line);background:var(--accent-soft)}
  .ev-slot.filled{border-style:solid;border-color:var(--line);background:var(--card);min-height:0}
  .ev-slot .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
  .ev-slot .ph svg{width:18px;height:18px;opacity:.7}
  .ev-slot img{width:100%;height:auto;object-fit:contain;display:block}
  .ev-tag{position:absolute;top:6px;left:6px;font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--spine);color:var(--spine-ink);padding:2px 7px;border-radius:5px;z-index:2}
  .ev-slot.filled .ph{display:none}
  .ev-remove{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;border:0;cursor:pointer;display:none;place-items:center;z-index:3}
  .ev-slot.filled .ev-remove{display:grid}
  .ev-remove svg{width:12px;height:12px}
  .empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13px}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--radius);font-size:12.5px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger);color:#fff}
  @media(max-width:960px){.save-pill{display:none}}
  @media(max-width:760px){
    .wrap{padding:16px 12px 70px}
    .grid,.import-row{grid-template-columns:1fr}
    .card-head{padding:13px 14px}
    .card-body{padding:15px}
    .step{display:none}
    .topbar-inner{padding:10px 12px;gap:8px;flex-wrap:nowrap;justify-content:space-between}
    .brand{flex:1;min-width:0;margin-bottom:0;gap:9px}
    .brand h1{font-size:14px;line-height:1.05}
    .brand p{display:none}
    .spacer{display:none}
    .logo{width:32px;height:32px;border-radius:8px}
    .logo svg{width:18px;height:18px}
    .btn{padding:7px 9px;font-size:11px;flex:0 0 auto;justify-content:center;gap:5px}
    .btn svg{width:14px;height:14px}
    .btn-toggle{width:30px;height:30px}
    .btn-toggle svg{width:14px;height:14px}
    .entry-fields{grid-template-columns:1fr 1fr}
    .eviden{grid-template-columns:repeat(3,1fr);padding:6px 14px 14px;gap:10px}
    /* 16px inputs prevent iOS auto-zoom on focus */
    input,select,textarea{font-size:16px}
    textarea{font-size:14px}
  }
  @media(max-width:440px){
    .entry-no{flex:0 0 44px}
    .entry-no input{width:36px}
    .entry-main{padding:12px}
    .entry-fields{grid-template-columns:1fr}
    .eviden{grid-template-columns:repeat(3,1fr);gap:9px}
    .ev-slot{min-height:92px}
    .ev-tag{font-size:8px;padding:2px 5px}
    .del-btn{margin:10px 8px 0 0}
  }
  @media print{.topbar,.wrap,.toast{display:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">
        <img src="icon.png" alt="Logo" style="width:100%;height:100%;border-radius:inherit;display:block">
      </div>
      <div>
        <h1>Eviden<br>LCS</h1>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="save-pill"><span class="save-dot" id="saveDot"></span><span id="saveTxt">Tersimpan otomatis</span></div>
    <button class="btn-toggle" onclick="toggleTheme()" title="Ganti Tema">
      <svg id="sun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
    <button class="btn-toggle" onclick="resetAll()" title="Mulai dari awal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="btn btn-gold" onclick="exportExcel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13l6 5M15 13l-6 5"/></svg>Excel
    </button>
    <button class="btn btn-white" onclick="downloadPDF()" title="Unduh file PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>PDF
    </button>
  </div>
</div>

<div class="wrap">

  <!-- IDENTITAS -->
  <div class="card">
    <div class="card-head">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div><h2>Identitas Penyuluh</h2></div>
      <span class="step">LANGKAH 1</span>
    </div>
    <div class="card-body">
      <div class="grid">
        <div class="field">
          <label>Bulan</label>
          <select id="bulan">
            <option value="" disabled selected>PILIH BULAN</option>
            <option value="JANUARI">JANUARI</option>
            <option value="FEBRUARI">FEBRUARI</option>
            <option value="MARET">MARET</option>
            <option value="APRIL">APRIL</option>
            <option value="MEI">MEI</option>
            <option value="JUNI">JUNI</option>
            <option value="JULI">JULI</option>
            <option value="AGUSTUS">AGUSTUS</option>
            <option value="SEPTEMBER">SEPTEMBER</option>
            <option value="OKTOBER">OKTOBER</option>
            <option value="NOVEMBER">NOVEMBER</option>
            <option value="DESEMBER">DESEMBER</option>
          </select>
        </div>
        <div class="field"><label>Nama Penyuluh</label><input type="text" id="nama" placeholder="Nama lengkap"></div>
        <div class="field"><label>NIP</label><input type="text" id="nip" placeholder="NIP"></div>
        <div class="field"><label>Wilayah Binaan</label><input type="text" id="wilbin" placeholder="Desa / WKPP"></div>
        <div class="field"><label>Instansi / BPP</label><input type="text" id="instansi" placeholder="BPP ..."></div>
        <div class="field"><label>Kecamatan</label><input type="text" id="kecamatan" placeholder="Kecamatan"></div>
        <div class="field"><label>Kabupaten / Provinsi</label><input type="text" id="kabprov" placeholder="Kabupaten / Provinsi"></div>
      </div>
    </div>
  </div>

  <!-- IMPOR -->
  <div class="card">
    <div class="card-head">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></div>
      <div><h2>Impor Konten</h2></div>
      <span class="step">LANGKAH 2</span>
    </div>
    <div class="card-body">
      <div class="field">
        <textarea id="importBox" placeholder="Contoh (tempel apa adanya dari webapp):&#10;11 Februari 2026&#10;170 (Instagram : kementerianpertanian) NTB Jadi Kawasan Sentra Jagung Nasional&#10;171 (Tiktok : bppsdmp) Tanam Serentak, Tanam Harapan&#10;12 Februari 2026&#10;172 (Youtube : tvOneNews) Harga Pangan Turun"></textarea>
      </div>
      <button class="btn btn-emerald" style="justify-content:center;width:100%;margin-top:14px" onclick="doImport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Urai &amp; Tambahkan
      </button>
    </div>
  </div>

  <!-- DAFTAR -->
  <div class="card">
    <div class="card-head">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg></div>
      <div><h2>Daftar Konten & Eviden</h2></div>
      <span class="step">LANGKAH 3</span>
    </div>
    <div class="card-body">
      <div class="toolbar">
        <button class="btn btn-emerald btn-icon" onclick="addRow()" title="Tambah konten" aria-label="Tambah konten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <span class="count" id="countTxt">0 konten</span>
      </div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        <div>Belum ada konten. Tempel daftar di Langkah 2 atau klik <b>+</b>.</div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script>
const DEFAULTS={
  bulan:'',
  nama:'',
  nip:'',
  wilbin:'',
  instansi:'',
  kecamatan:'',
  kabprov:''
};
const PLATFORMS=['Instagram','Tiktok','Youtube','YT Short','Facebook','X','Website','Lainnya'];
const KEY='laporan_penderasan_v1';
let state={id:{},rows:[]};
let pendingUpload=null; // {rowId, type}

/* ---------- persistence ---------- */
function save(){
  state.id={};Object.keys(DEFAULTS).forEach(k=>{
    state.id[k] = val(k);
  });
  try{localStorage.setItem(KEY,JSON.stringify(state));flashSave();}catch(e){toast('Penyimpanan penuh (gambar terlalu besar)',true);}
}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{state=JSON.parse(raw);}catch(e){state={id:{},rows:[]};}}
  if(!state.id||!Object.keys(state.id).length)state.id={...DEFAULTS};
  if(!Array.isArray(state.rows))state.rows=[];
  for(const k in DEFAULTS){setVal(k,state.id[k]??DEFAULTS[k]);}
  render();
}
function val(id){
  return document.getElementById(id).value;
}
function setVal(id,v){
  document.getElementById(id).value=v||'';
}
let saveTimer=null;
function flashSave(){
  const d=document.getElementById('saveDot'),t=document.getElementById('saveTxt');
  d.classList.add('saving');t.textContent='Menyimpan…';
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{d.classList.remove('saving');t.textContent='Tersimpan otomatis';},650);
}

/* ---------- rows ---------- */
function nextNo(){
  let mx=0;state.rows.forEach(r=>{const n=parseInt(r.no);if(!isNaN(n)&&n>mx)mx=n;});
  return mx?mx+1:'';
}
function addRow(data){
  const r=Object.assign({
    rid:Date.now()+Math.random().toString(36).slice(2,6),
    date:'',no:nextNo(),platform:'Instagram',account:'',title:'',
    like:null,comment:null,share:null
  },data||{});
  state.rows.push(r);render();save();
  return r;
}
function delRow(rid){state.rows=state.rows.filter(r=>r.rid!==rid);render();save();}
function clearRows(){if(state.rows.length&&!confirm('Kosongkan seluruh daftar konten?'))return;state.rows=[];render();save();}
function field(rid,k,v){const r=state.rows.find(x=>x.rid===rid);if(r){r[k]=v;save();if(k==='date')render();}}

function render(){
  const box=document.getElementById('rows');
  document.getElementById('emptyState').style.display=state.rows.length?'none':'block';
  document.getElementById('countTxt').textContent=state.rows.length+' konten';
  box.innerHTML='';
  state.rows.forEach(r=>{
    const el=document.createElement('div');el.className='entry';
    const opts=PLATFORMS.map(p=>`<option ${p===r.platform?'selected':''}>${p}</option>`).join('');
    el.innerHTML=`
      <div class="entry-top">
        <div class="entry-no"><span>NO</span><input type="text" value="${esc(r.no)}" onchange="field('${r.rid}','no',this.value)"></div>
        <div class="entry-main">
          <div class="entry-fields">
            <div class="field-sm"><label>Tanggal</label><input type="text" value="${esc(r.date)}" placeholder="11 Februari 2026" onchange="field('${r.rid}','date',this.value)"></div>
            <div class="field-sm"><label>Akun</label><input type="text" value="${esc(r.account)}" placeholder="kementerianpertanian" onchange="field('${r.rid}','account',this.value)"></div>
            <div class="field-sm"><label>Platform</label><select onchange="field('${r.rid}','platform',this.value)">${opts}</select></div>
          </div>
          <div class="field-sm"><label>Judul Konten</label><input type="text" value="${esc(r.title)}" placeholder="Judul / isi konten" onchange="field('${r.rid}','title',this.value)"></div>
        </div>
        <button class="del-btn" title="Hapus" onclick="delRow('${r.rid}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div>
      <div class="eviden">
        ${evSlot(r,'like','LIKE')}${evSlot(r,'comment','COMMENT')}${evSlot(r,'share','SHARE')}
      </div>`;
    box.appendChild(el);
  });
}
function evSlot(r,type,labelTxt){
  const img=r[type];
  return `<div class="ev-slot ${img?'filled':''}" onclick="pickImage('${r.rid}','${type}')">
    <span class="ev-tag">${labelTxt}</span>
    ${img?`<img src="${img}" alt="${labelTxt}">`:`<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Unggah</div>`}
    <button class="ev-remove" onclick="event.stopPropagation();removeImage('${r.rid}','${type}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>`;
}

/* ---------- images ---------- */
function pickImage(rid,type){pendingUpload={rid,type};document.getElementById('fileInput').click();}
function removeImage(rid,type){const r=state.rows.find(x=>x.rid===rid);if(r){r[type]=null;render();save();}}
document.getElementById('fileInput').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f||!pendingUpload)return;
  resizeImage(f,2000,3000,0.95).then(dataUrl=>{
    const r=state.rows.find(x=>x.rid===pendingUpload.rid);
    if(r){r[pendingUpload.type]=dataUrl;render();save();}
    pendingUpload=null;this.value='';
  }).catch(()=>{toast('Gagal memuat gambar',true);this.value='';});
});
function resizeImage(file,maxW,maxH,q){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;const ratio=Math.min(maxW/w,maxH/h,1);
      w=Math.round(w*ratio);h=Math.round(h*ratio);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;
  });
}

/* ---------- import parser ---------- */
const MONTHS='januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember';
const MONTHS_CAP=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function doImport(){
  const txt=document.getElementById('importBox').value;
  if(!txt.trim()){toast('Kotak impor masih kosong',true);return;}
  const lines=txt.split(/\r?\n/);
  let curDate='';const n=nextNo();let auto=n?parseInt(n):null;
  const dateRe=new RegExp('^\\s*(\\d{1,2})\\s+('+MONTHS+')\\s+(\\d{4})\\s*$','i');
  const dmyRe=/(?:^|:)\s*(\d{1,2})-(\d{1,2})-(\d{4})\s*$/;   // "11-06-2026" or "Instagram: 11-06-2026"
  const contentRe=/^\d+\s*\(/;                               // E-Pusluh content: 390 (Platform: akun) judul
  // E-Pusluh paste (has DD-MM-YYYY date or an "Instruksi" line) -> strict: keep only content + dates, drop noise
  const strict=lines.some(l=>/\b\d{1,2}-\d{1,2}-\d{4}\b/.test(l)||/^\s*instruksi\b/i.test(l));
  let added=0;
  lines.forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(dateRe.test(line)){curDate=line.replace(/\s+/g,' ');return;}
    const dm=line.match(dmyRe);
    if(dm){curDate=parseInt(dm[1],10)+' '+MONTHS_CAP[parseInt(dm[2],10)-1]+' '+dm[3];return;}
    if(strict && !contentRe.test(line))return;   // skip banner / Instruksi / buttons / menu / pagination
    let no='',platform='Instagram',account='',title=line;
    const numM=line.match(/^(\d+)\s*(.*)$/);
    let rest=line;
    if(numM){no=numM[1];rest=numM[2].trim();}
    else if(!strict && auto){no=String(auto++);}
    // parse (Platform : account)
    let pm=rest.match(/^\(([^)]*)\)\s*(.*)$/);          // closed paren
    if(!pm)pm=rest.match(/^\(([^)]*)$/);                 // unclosed paren -> inside only, no title... handle below
    if(pm){
      const inside=pm[1].trim();title=(pm[2]!==undefined?pm[2]:'').trim();
      let pmatch=inside.match(/^([^:]+):\s*(.*)$/);
      if(pmatch){platform=normPlat(pmatch[1]);
        // when paren was unclosed, the colon-tail is actually the title
        if(pm[2]===undefined){title=pmatch[2].trim();account='';}
        else account=pmatch[2].trim();
      }else{
        const parts=inside.split(/\s+/);platform=normPlat(parts[0]);account=parts.slice(1).join(' ');
      }
    }else{title=rest;}
    addRowSilent({date:curDate,no,platform,account,title});added++;
  });
  render();save();
  document.getElementById('importBox').value='';
  toast(added+' konten ditambahkan'+(strict?' · mode E-Pusluh':''));
}
function addRowSilent(data){
  state.rows.push(Object.assign({
    rid:Date.now()+Math.random().toString(36).slice(2,6),
    date:'',no:'',platform:'Instagram',account:'',title:'',like:null,comment:null,share:null
  },data));
}
function normPlat(s){
  s=(s||'').trim();const low=s.toLowerCase();
  if(low.startsWith('insta')||low==='ig')return'Instagram';
  if(low.startsWith('tik'))return'Tiktok';
  if(low.startsWith('yt short')||low.startsWith('yt-short')||low.startsWith('short'))return'YT Short';
  if(low.startsWith('you')||low==='yt')return'Youtube';
  if(low.startsWith('fb')||low.startsWith('face'))return'Facebook';
  if(low==='x'||low.startsWith('twit'))return'X';
  if(low.startsWith('web')||low.startsWith('http'))return'Website';
  return s||'Lainnya';
}

/* ---------- judul string ---------- */
function judul(r){
  let head=r.account?`(${r.platform} : ${r.account})`:`(${r.platform})`;
  let t = (r.title || '').trim();
  if (t) t = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  return `${r.no?r.no+' ':''}${head} ${t}`.trim();
}

/* ---------- group by date for merged cells ---------- */
function grouped(){
  const g=[];let cur=null;
  state.rows.forEach(r=>{
    const d=r.date||'';
    if(!cur||cur.date!==d){cur={date:d,items:[]};g.push(cur);}
    cur.items.push(r);
  });
  return g;
}

/* ---------- PDF (self-contained pagination → print, offline) ---------- */
const PRINT_CSS=`
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family: 'Instrument Sans', sans-serif;color:#000}
@page{size:A4;margin:0}
.sheet{width:794px;min-height:1123px;padding:49px 42px 60px;position:relative;page-break-after:always;overflow:hidden}
.sheet:last-child{page-break-after:auto}
.banner{text-align:center;padding:2px 10px 10px;margin-bottom:8px}
.banner .t1{font-weight:700;font-size:17px;letter-spacing:.3px;line-height:1.25}
.banner .t2{font-weight:700;font-size:15px;margin-top:3px}
.idblock{margin:0 0 12px}
.p-id{display:flex;font-size:13px;line-height:1.5;font-weight:400}
.p-id .k{width:175px;flex:0 0 175px}
.p-id .c{width:14px;flex:0 0 14px}
table.rpt{width:710px;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.rpt th,table.rpt td{border:0.5px solid #000;padding:5px 6px;vertical-align:middle;word-wrap:break-word;overflow-wrap:break-word}
table.rpt th{text-align:center;font-weight:400 !important;white-space:nowrap}
.p-date{text-align:center;font-weight:400}
.p-judul{vertical-align:top;text-align:left}
.p-ev{text-align:center;padding:4px}
.p-ev img{width:100%;max-height:300px;object-fit:contain;display:block;margin:0 auto}
.foot{position:absolute;left:42px;right:42px;bottom:26px;text-align:right;font-size:11px}
`;
const COLG='<colgroup><col style="width:68px"><col><col style="width:148px"><col style="width:148px"><col style="width:148px"></colgroup>';
const THEAD='<thead><tr><th rowspan="2">TANGGAL</th><th rowspan="2">JUDUL KONTEN</th><th colspan="3">EVIDEN</th></tr><tr><th>LIKE</th><th>COMMENT</th><th>SHARE</th></tr></thead>';
function bannerHTML(){return '<div class="banner"><div class="t1">LAPORAN PENDERASAN INFORMASI DAN PEMBANGUNAN PERTANIAN</div><div class="t2">PENYULUH PERTANIAN TAHUN 2026</div></div>';}
function idBlockHTML(){
  const id=state.id;
  const rows=[['BULAN',id.bulan],['NAMA PENYULUH',id.nama],['NIP',id.nip],['WILAYAH BINAAN',id.wilbin],['INSTANSI/BPP',id.instansi],['KECAMATAN',id.kecamatan],['KABUPATEN/PROVINSI',id.kabprov]];
  return '<div class="idblock">'+rows.map(([k,v])=>`<div class="p-id"><span class="k">${k}</span><span class="c">:</span><span class="v">${esc(v||'')}</span></div>`).join('')+'</div>';
}
function evImg(r,t){return r[t]?`<img src="${r[t]}">`:'';}
function trHTML(r,dateCell){
  return `<tr>${dateCell}<td class="p-judul">${esc(judul(r))}</td><td class="p-ev">${evImg(r,'like')}</td><td class="p-ev">${evImg(r,'comment')}</td><td class="p-ev">${evImg(r,'share')}</td></tr>`;
}
function tbodyHTML(rows){ // merge consecutive same-date date cells within this page
  let out='',i=0;
  while(i<rows.length){
    let j=i;while(j+1<rows.length&&(rows[j+1].date||'')===(rows[i].date||''))j++;
    const span=j-i+1;
    for(let k=i;k<=j;k++){
      const dc=k===i?`<td class="p-date" rowspan="${span}">${esc(rows[i].date||'')}</td>`:'';
      out+=trHTML(rows[k],dc);
    }
    i=j+1;
  }
  return out;
}
function imagesReady(root){
  const imgs=[...root.querySelectorAll('img')];
  return Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(res=>{im.onload=im.onerror=res;})));
}
async function paginate(){
  const itemsPerPage = 3;
  const pages = [];
  for (let i = 0; i < state.rows.length; i += itemsPerPage) {
    pages.push(state.rows.slice(i, i + itemsPerPage));
  }
  const N = pages.length || 1;
  return pages.map((rows, pi) => {
    const head = pi === 0 ? `${bannerHTML()}${idBlockHTML()}` : '';
    return `<div class="sheet">${head}<table class="rpt">${COLG}${THEAD}<tbody>${tbodyHTML(rows)}</tbody></table><div class="foot">hal ${pi + 1} dari ${N}</div></div>`;
  }).join('');
}
function todayId(){const d=new Date();const m=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();}
function fileBase(){return 'Eviden LCS '+todayId();}
// Download: builds a real .pdf file and downloads it directly
async function downloadPDF(){
  if(!state.rows.length){toast('Belum ada konten untuk diunduh',true);return;}
  if(typeof html2canvas==='undefined'||!window.jspdf){toast('Library PDF belum termuat — cek koneksi internet',true);return;}
  save();toast('Membuat file PDF…');
  const sheets=await paginate();
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;background:#fff';
  holder.innerHTML=`<style>${PRINT_CSS}</style>${sheets}`;
  document.body.appendChild(holder);
  await imagesReady(holder);
  try{
    const sheetEls=[...holder.querySelectorAll('.sheet')];
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','pt','a4');
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
    const scale=5;
    for(let i=0;i<sheetEls.length;i++){
      const canvas=await html2canvas(sheetEls[i],{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,imageTimeout:0});
      const img=canvas.toDataURL('image/jpeg',0.96);
      if(i>0)pdf.addPage();
      pdf.addImage(img,'JPEG',0,0,W,H,undefined,'SLOW');
    }
    pdf.save(fileBase()+'.pdf');
    toast('File PDF diunduh');
  }catch(e){toast('Gagal membuat PDF: '+e.message,true);}
  finally{holder.remove();}
}

/* ---------- Excel (ExcelJS w/ embedded images) ---------- */
async function exportExcel(){
  if(typeof ExcelJS==='undefined'){toast('Library Excel belum termuat — cek koneksi internet',true);return;}
  if(!state.rows.length){toast('Belum ada konten untuk diekspor',true);return;}
  save();toast('Menyusun file Excel…');
  const id=state.id;
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet((id.bulan||'Laporan').slice(0,28),{views:[{showGridLines:false}],pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.headerFooter={oddFooter:'&RHal &P dari &N',evenFooter:'&RHal &P dari &N'};
  ws.columns=[{width:14},{width:44},{width:23},{width:23},{width:23}];
  const thin={style:'thin',color:{argb:'FF000000'}};
  const border={top:thin,left:thin,bottom:thin,right:thin};
  const center={vertical:'middle',horizontal:'center',wrapText:true};

  const dimCache={};
  const dimsOf=u=>dimCache[u]||(dimCache[u]=new Promise(res=>{const im=new Image();im.onload=()=>res({w:im.naturalWidth||120,h:im.naturalHeight||150});im.onerror=()=>res({w:120,h:150});im.src=u;}));
  // width 23 in ExcelJS is ~170px. We use 165 for safety to avoid overlap.
  const CELLW=165,MAXH=400,COLPX=170;

  let dr = 1;
  const itemsPerPage = 3;
  for (let i = 0; i < state.rows.length; i += itemsPerPage) {
    const pageRows = state.rows.slice(i, i + itemsPerPage);

    // title (only on first "page" block or every block? PDF only has it on first page.
    // But user says "make the excel formatted like the downloaded pdf", so let's match PDF.
    if (i === 0) {
      ws.mergeCells(`A${dr}:E${dr}`);ws.getCell(`A${dr}`).value='LAPORAN PENDERASAN INFORMASI DAN PEMBANGUNAN PERTANIAN';
      ws.mergeCells(`A${dr+1}:E${dr+1}`);ws.getCell(`A${dr+1}`).value='PENYULUH PERTANIAN TAHUN 2026';
      ws.getRow(dr).height=20;ws.getRow(dr+1).height=18;
      [`A${dr}`,`A${dr+1}`].forEach(c=>{const cell=ws.getCell(c);cell.font={bold:true,size:c.includes('A'+dr)?12:11,name:'Instrument Sans'};cell.alignment={horizontal:'center',vertical:'middle'};});
      dr += 3;
      const idRows=[['BULAN',id.bulan],['NAMA PENYULUH',id.nama],['NIP',id.nip],['WILAYAH BINAAN',id.wilbin],['INSTANSI/BPP',id.instansi],['KECAMATAN',id.kecamatan],['KABUPATEN/PROVINSI',id.kabprov]];
      idRows.forEach(([k,v])=>{ws.getCell('A'+dr).value=k;ws.getCell('B'+dr).value=': '+(v||'');ws.getCell('A'+dr).font={name:'Instrument Sans',size:10,bold:false};ws.getCell('B'+dr).font={name:'Instrument Sans',size:10,bold:false};dr++;});
      dr++; // gap
    }

    // header
    const hr=dr;
    ws.mergeCells(`A${hr}:A${hr+1}`);ws.getCell('A'+hr).value='TANGGAL';
    ws.mergeCells(`B${hr}:B${hr+1}`);ws.getCell('B'+hr).value='JUDUL KONTEN';
    ws.mergeCells(`C${hr}:E${hr}`);ws.getCell('C'+hr).value='EVIDEN';
    ws.getCell('C'+(hr+1)).value='LIKE';ws.getCell('D'+(hr+1)).value='COMMENT';ws.getCell('E'+(hr+1)).value='SHARE';
    for(let c=1;c<=5;c++){[hr,hr+1].forEach(rw=>{const cell=ws.getCell(rw,c);cell.font={bold:false,name:'Instrument Sans',size:10};cell.alignment=center;cell.border=border;});}
    dr = hr + 2;

    // data
    // We need grouped rows for the current pageRows
    const gPage = []; let cur = null;
    pageRows.forEach(r => {
      const d = r.date || '';
      if (!cur || cur.date !== d) { cur = { date: d, items: [] }; gPage.push(cur); }
      cur.items.push(r);
    });

    for(const g of gPage){
      const start=dr;
      for(const r of g.items){
        const tCell=ws.getCell('B'+dr);tCell.value=judul(r);tCell.alignment={vertical:'middle',wrapText:true};tCell.font={name:'Instrument Sans',size:10};
        ['A','B','C','D','E'].forEach(c=>ws.getCell(c+dr).border=border);
        ws.getCell('A'+dr).alignment=center;ws.getCell('A'+dr).font={name:'Instrument Sans',size:10};
        let maxImgH=58;
        for(const [type,col] of [['like',2],['comment',3],['share',4]]){
          if(r[type]){
            try{
              const d=await dimsOf(r[type]);
              const ratio=Math.min(CELLW/d.w,MAXH/d.h);
              const w2=Math.round(d.w*ratio),h2=Math.round(d.h*ratio);
              const ext=r[type].includes('image/png')?'png':'jpeg';
              const imgId=wb.addImage({base64:r[type].split(',')[1],extension:ext});
              const offX = (COLPX - w2) / 2; // px
              ws.addImage(imgId,{tl:{col:col+(offX/COLPX),row:dr-1+0.05},ext:{width:w2,height:h2},editAs:'oneCell'});
              if(h2>maxImgH)maxImgH=h2;
            }catch(e){}
          }
        }
        ws.getRow(dr).height=Math.round(maxImgH*0.76)+15;
        dr++;
      }
      if(g.items.length>1){ws.mergeCells(`A${start}:A${dr-1}`);}
      ws.getCell('A'+start).value=g.date||'';ws.getCell('A'+start).alignment=center;
    }

    if (i + itemsPerPage < state.rows.length) {
      ws.getRow(dr).addPageBreak();
      dr++;
    }
  }
  const buf=await wb.xlsx.writeBuffer();
  const fname=fileBase()+'.xlsx';
  downloadBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fname);
  toast('File Excel diunduh');
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
}

/* ---------- misc ---------- */
function resetAll(){
  if(!confirm('Kosongkan SEMUA isi data (identitas & seluruh daftar konten)? Tindakan ini tidak bisa dibatalkan.'))return;
  state={id:{},rows:[]};
  Object.keys(DEFAULTS).forEach(k=>setVal(k,''));
  render();save();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600);}
Object.keys(DEFAULTS).forEach(idn=>document.getElementById(idn).addEventListener('input',save));
document.getElementById('wilbin').addEventListener('blur',function(){
  let v=this.value.trim();
  if(v && !v.toUpperCase().startsWith('DESA ')) v='Desa '+v;
  this.value=v;save();
});
document.getElementById('instansi').addEventListener('blur',function(){
  let v=this.value.trim();
  if(v && !v.toUpperCase().startsWith('BPP ')) v='BPP '+v;
  this.value=v;save();
});
window.addRow=addRow;window.delRow=delRow;window.clearRows=clearRows;window.field=field;
window.pickImage=pickImage;window.removeImage=removeImage;window.doImport=doImport;
function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark=document.body.classList.contains('dark');
  localStorage.setItem('theme',isDark?'dark':'light');
  updateThemeIcons();
}
function updateThemeIcons(){
  const isDark=document.body.classList.contains('dark');
  document.getElementById('sun').style.display=isDark?'block':'none';
  document.getElementById('moon').style.display=isDark?'none':'block';
}
if(localStorage.getItem('theme')!=='light'){document.body.classList.add('dark');}
updateThemeIcons();
window.downloadPDF=downloadPDF;window.exportExcel=exportExcel;window.resetAll=resetAll;window.toggleTheme=toggleTheme;
load();

// Auto-import content handed over from the LCS webapp bookmarklet via URL hash
(function(){
  try{
    var m=location.hash.match(/(?:^#|&)import=([^&]+)/);
    if(!m)return;
    var text=decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
    history.replaceState(null,'',location.pathname+location.search);
    var box=document.getElementById('importBox');
    if(box && text.trim()){
      box.value=(box.value.trim()?box.value.replace(/\s+$/,'')+'\n':'')+text;
      doImport();
    }
  }catch(e){}
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
